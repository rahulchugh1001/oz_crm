<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manufacturing Traceability System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            font-size: 13px;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Modal animations */
        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .modal-content {
            animation: modalFadeIn 0.2s ease-out;
        }
        
        /* Smooth transitions */
        * {
            transition: all 0.2s ease;
        }
        
        /* Status colors */
        .status-available { background-color: #dcfce7; color: #166534; }
        .status-in-use { background-color: #dbeafe; color: #1e40af; }
        .status-completed { background-color: #e5e7eb; color: #374151; }
        .status-running { background-color: #dcfce7; color: #166534; }
        .status-stopped { background-color: #fee2e2; color: #991b1b; }
        
        /* Corporate Color Palette */
        :root {
            --corporate-blue: #1d4ed8;
            --corporate-navy: #1e3a8a;
            --corporate-teal: #0d9488;
            --corporate-emerald: #059669;
            --corporate-amber: #d97706;
            --corporate-coral: #dc2626;
            --corporate-slate: #334155;
            --corporate-gray: #f8fafc;
        }
        
        .gradient-primary {
            background: linear-gradient(135deg, var(--corporate-navy) 0%, var(--corporate-blue) 100%);
        }
        
        .gradient-success {
            background: linear-gradient(135deg, var(--corporate-teal) 0%, var(--corporate-emerald) 100%);
        }
        
        .gradient-warning {
            background: linear-gradient(135deg, var(--corporate-amber) 0%, #f59e0b 100%);
        }
        
        .gradient-danger {
            background: linear-gradient(135deg, var(--corporate-coral) 0%, #ef4444 100%);
        }
        
        .shadow-subtle {
            box-shadow: 0 2px 12px rgba(30, 58, 138, 0.08);
        }
        
        .shadow-elevated {
            box-shadow: 0 8px 24px rgba(30, 58, 138, 0.12);
        }
        
        .border-corporate {
            border-color: #e2e8f0;
        }
        
        .hover-lift:hover {
            transform: translateY(-2px);
            transition: transform 0.2s ease;
        }
        
        /* Table styles */
        .report-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 12px;
        }
        
        .report-table th {
            background-color: #f8fafc;
            font-weight: 600;
            color: #334155;
            border: 1px solid #e2e8f0;
            padding: 8px 4px;
            text-align: center;
            white-space: nowrap;
        }
        
        .report-table td {
            border: 1px solid #e2e8f0;
            padding: 6px 4px;
            text-align: center;
        }
        
        .report-table input {
            width: 60px;
            padding: 4px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            text-align: center;
            font-size: 12px;
        }
        
        .report-table input:focus {
            outline: none;
            border-color: #1d4ed8;
            ring: 2px solid #1d4ed8;
        }
        
        .machine-name {
            text-align: left;
            padding-left: 8px !important;
            white-space: nowrap;
        }
    </style>
</head>

        // React-like components
        const StatusBadge = (status) => {
            const config = {
                'available': { color: 'bg-emerald-100 text-emerald-800', icon: 'check-circle', text: 'Available' },
                'in-use': { color: 'bg-blue-100 text-blue-800', icon: 'loader', text: 'In Use' },
                'completed': { color: 'bg-slate-100 text-slate-800', icon: 'check-circle', text: 'Completed' },
                'running': { color: 'bg-emerald-100 text-emerald-800', icon: 'play-circle', text: 'Running' },
                'stopped': { color: 'bg-rose-100 text-rose-800', icon: 'pause-circle', text: 'Stopped' },
            };
            
            const { color, icon, text } = config[status] || config.available;
            
            return `
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-sm font-medium ${color}">
                    <i data-lucide="${icon}" class="w-4 h-4"></i>
                    ${text}
                </span>
            `;
        };

        const Modal = (title, content, size = 'md', onClose) => {
            const sizeClasses = {
                sm: 'max-w-md',
                md: 'max-w-2xl',
                lg: 'max-w-4xl',
                xl: 'max-w-6xl',
                '2xl': 'max-w-7xl',
            };
            
            return `
                <div class="fixed inset-0 z-50 overflow-y-auto bg-black bg-opacity-50 flex items-center justify-center p-4">
                    <div class="modal-content ${sizeClasses[size]} w-full bg-white rounded-2xl shadow-xl">
                        <div class="px-6 py-4 border-b border-gray-200 gradient-primary rounded-t-2xl">
                            <div class="flex items-center justify-between">
                                <h3 class="text-lg font-semibold text-white">${title}</h3>
                                <button onclick="${onClose}" class="p-1 hover:bg-white/20 rounded-lg">
                                    <i data-lucide="x" class="w-5 h-5 text-white"></i>
                                </button>
                            </div>
                        </div>
                        ${content}
                    </div>
                </div>
            `;
        };

        // Application State
        let appState = {
            activePage: 'dashboard',
            userRole: 'supervisor',
            selectedCoil: null,
            notifications: 3,
            coils: JSON.parse(JSON.stringify(manufacturingData.coils)),
            machines: JSON.parse(JSON.stringify(manufacturingData.machines)),
            productionRecords: JSON.parse(JSON.stringify(manufacturingData.productionRecords)),
            hourlyReports: JSON.parse(JSON.stringify(manufacturingData.hourlyReports)),
            showProductionModal: false,
            showUnloadModal: false,
            selectedMachine: null,
            mastersDropdownOpen: false,
            selectedRecord: null,
            formDate: '2023-06-28',
            formShift: 'Day'
        };

        // Navigation Functions
        function navigateTo(page, recordId = null) {
            appState.activePage = page;
            if (recordId) {
                if (page === 'hourly-report-view') {
                    appState.selectedRecord = appState.hourlyReports.find(r => r.id === recordId);
                } else {
                    appState.selectedRecord = appState.productionRecords.find(r => r.id === recordId);
                }
            }
            renderApp();
        }

        function toggleMastersDropdown() {
            appState.mastersDropdownOpen = !appState.mastersDropdownOpen;
            renderApp();
        }

        function updateCoilStatus(coilId, newStatus) {
            appState.coils = appState.coils.map(coil => 
                coil.id === coilId ? { ...coil, status: newStatus } : coil
            );
        }

        function updateMachine(machineId, updates) {
            appState.machines = appState.machines.map(machine => 
                machine.id === machineId ? { ...machine, ...updates } : machine
            );
        }

        function addProductionRecord(formData) {
            const newRecord = {
                id: appState.productionRecords.length + 1,
                date: formData.date || appState.formDate,
                shift: formData.shift || appState.formShift,
                supervisor: formData.supervisor,
                operator: formData.operator,
                product: formData.product,
                part: formData.part,
                productSize: formData.productSize,
                binNumber: formData.binNumber,
                binWeight: parseFloat(formData.binWeight),
                avgPartWeight: parseFloat(formData.avgPartWeight),
                productionWeight: parseFloat(formData.productionWeight),
                productionQuantity: parseInt(formData.productionQuantity),
                scrapWeight: parseFloat(formData.scrapWeight),
                rejection: formData.rejection,
                heatNo: formData.heatNo,
                inspection: formData.inspection,
                chemicalComposition: formData.chemicalComposition,
                mechanicalProps: formData.mechanicalProps,
                hardness: formData.hardness,
                remarks: formData.remarks
            };
            appState.productionRecords = [newRecord, ...appState.productionRecords];
            appState.notifications++;
        }

        function addHourlyReport(formData) {
            const newReport = {
                id: appState.hourlyReports.length + 1,
                date: appState.formDate,
                shift: appState.formShift,
                ...formData
            };
            appState.hourlyReports = [newReport, ...appState.hourlyReports];
            appState.notifications++;
        }

        // Calculate total for hourly inputs
        function calculateTotal(rowId) {
            let total = 0;
            for (let i = 0; i < 12; i++) {
                const input = document.getElementById(`${rowId}_hour_${i}`);
                if (input && input.value) {
                    total += parseFloat(input.value) || 0;
                }
            }
            const totalElement = document.getElementById(`${rowId}_total`);
            if (totalElement) {
                totalElement.textContent = total;
            }
            return total;
        }

            return `
                <header class="sticky top-0 z-30 bg-white border-b border-gray-100 shadow-subtle">

                                        ${index > 0 ? '<i data-lucide="chevron-right" class="w-4 h-4 mx-1 text-slate-400"></i>' : ''}

        function assignCoilToMachine(machineId) {
            if (!appState.selectedCoil) {
                navigateTo('coil-stock');
                return;
            }
            
            updateMachine(machineId, {
                coilNo: appState.selectedCoil.coilNo,
                coilSize: appState.selectedCoil.coilSize,
                coilMake: appState.selectedCoil.coilMake,
                thickness: appState.selectedCoil.thickness,
                netWeight: appState.selectedCoil.totalWeight,
                remainingWeight: appState.selectedCoil.totalWeight,
                loadTime: new Date().toLocaleString('en-US', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit'
                }),
                status: 'running'
            });
            
            appState.selectedCoil = null;
            renderApp();
        }

        function showUnloadModal(machineId) {
            appState.selectedMachine = appState.machines.find(m => m.id === machineId);

                                        <td><input type="number" id="setPerHour_ball_04" name="setPerHour_ball_04" value="6"></td>
                                        ${Array.from({length: 12}, (_, i) => `
                                            <td><input type="number" id="ball_04_hour_${i}" name="ball_04_hour_${i}" value="${4 + i}" onchange="calculateTotal('ball_04')"></td>
                                        `).join('')}
                                        <td id="ball_04_total" class="font-medium">54</td>
                                        <td><input type="number" id="staff_ball_04" name="staff_ball_04" value="1"></td>
                                        <td><input type="number" id="workman_ball_04" name="workman_ball_04" value="2"></td>
                                    </tr>
                                </tbody>
                            </table>
                            
                            <!-- Form Actions -->
                            <div class="mt-6 flex items-center justify-end gap-3">
                                <button type="button" onclick="navigateTo('operations')" 
                                        class="px-6 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 font-medium text-sm">
                                    Cancel
                                </button>
                                <button type="submit" 
                                        class="px-6 py-2 gradient-primary text-white rounded-lg font-medium hover:shadow-elevated transition-all text-sm">
                                    Save Production Report
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        function calculateTotal(rowId) {
            let total = 0;
            for (let i = 0; i < 12; i++) {
                const input = document.getElementById(`${rowId}_hour_${i}`);
                if (input && input.value) {
                    total += parseFloat(input.value) || 0;
                }
            }
            const totalElement = document.getElementById(`${rowId}_total`);
            if (totalElement) {
                totalElement.textContent = total;
            }
        }

        function updateFormDate(value) {
            appState.formDate = value;
        }

        function updateFormShift(value) {
            appState.formShift = value;
        }

        function handleUpdateProductionSubmit(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const formObject = {};
            formData.forEach((value, key) => {
                formObject[key] = value;
            });
            
            // Add date and shift
            formObject.date = appState.formDate;
            formObject.shift = appState.formShift;
            
            console.log('Hourly Report Data:', formObject);
            
            // Add to hourly reports
            appState.hourlyReports.push({
                id: appState.hourlyReports.length + 1,
                date: appState.formDate,
                shift: appState.formShift,
                ...formObject
            });
            
            appState.notifications++;
            navigateTo('completed');
        }

        function renderUnloadModal() {
            const machine = appState.selectedMachine;
            
            return Modal('Unload Coil', `
                <form onsubmit="handleUnloadCoil(event)" class="px-6 py-6">
                    <div class="mb-6 p-4 bg-amber-50 border border-amber-200 rounded-xl">
                        <div class="flex items-start gap-3">
                            <i data-lucide="alert-circle" class="text-amber-600 mt-0.5 w-5 h-5"></i>
                            <div>
                                <h4 class="font-medium text-amber-900">Unload Confirmation</h4>
                                <p class="text-sm text-amber-700 mt-1">
                                    This will stop machine <strong>${machine.machine}</strong> and move coil 
                                    <strong>${machine.coilNo}</strong> to completed production.
                                </p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Machine</label>
                            <input type="text" value="${machine.machine}" disabled 
                                   class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Coil Number</label>
                            <input type="text" value="${machine.coilNo}" disabled 
                                   class="w-full px-3 py-2 border border-slate-300 rounded-lg bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Final Remaining Weight (Kg) *</label>
                            <input type="number" step="0.1" name="remainingWeight" value="${machine.remainingWeight}" required 
                                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <p class="text-sm text-slate-500 mt-1">Enter the actual remaining weight after production</p>
                        </div>
                    </div>
                    
                    <div class="mt-6 pt-6 border-t border-slate-200">
                        <div class="flex items-center justify-end gap-3">
                            <button type="button" onclick="closeUnloadModal()" 
                                    class="px-4 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 font-medium">
                                Cancel
                            </button>
                            <button type="submit" 
                                    class="px-4 py-2 gradient-danger text-white rounded-lg font-medium hover:shadow-elevated transition-all">
                                Update & Unload
                            </button>
                        </div>
                    </div>
                </form>
            `, 'sm', 'closeUnloadModal()');
        }

        function handleUnloadCoil(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const remainingWeight = formData.get('remainingWeight');
            
            if (appState.selectedMachine) {
                updateMachine(appState.selectedMachine.id, {
                    status: 'stopped',
                    unloadTime: new Date().toLocaleString('en-US', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    }),
                    remainingWeight
                });
                
                // Update coil status to completed
                const coil = appState.coils.find(c => c.coilNo === appState.selectedMachine.coilNo);
                if (coil) {
                    updateCoilStatus(coil.id, 'completed');
                }
            }
            
            appState.showUnloadModal = false;
            appState.selectedMachine = null;
            renderApp();
        }

        function closeUnloadModal() {
            appState.showUnloadModal = false;
            appState.selectedMachine = null;
            renderApp();
        }

        function renderCompleted() {
            // Group records by date
            const groupedRecords = appState.productionRecords.reduce((groups, record) => {
                if (!groups[record.date]) {
                    groups[record.date] = [];
                }
                groups[record.date].push(record);
                return groups;
            }, {});
            
            const sortedDates = Object.keys(groupedRecords).sort().reverse();
            
            return `
                <div class="p-6">
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-subtle overflow-hidden">
                        <div class="px-6 py-4 border-b border-slate-200">
                            <div class="flex items-center justify-between">
                                <div>
                                    <h2 class="text-lg font-bold text-slate-900">Production Traceability</h2>
                                    <p class="text-sm text-slate-500 mt-1">Complete audit trail of all production runs</p>
                                </div>
                                <div class="flex items-center gap-3">
                                    <button onclick="navigateTo('update-production')" class="flex items-center gap-2 px-4 py-2 gradient-success text-white rounded-lg font-medium hover:shadow-elevated transition-all">
                                        <i data-lucide="plus" class="w-4 h-4"></i>
                                        New Production Report
                                    </button>
                                                                        <button class="flex items-center gap-2 px-4 py-2 gradient-primary text-white rounded-lg font-medium hover:shadow-elevated transition-all">
                                        <i data-lucide="download" class="w-4 h-4"></i>
                                        Export Report
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Filter Tabs -->
                            <div class="flex gap-2 mt-4">
                                ${['Today', 'Yesterday', 'Last 7 Days', 'Last 30 Days', 'Select Range'].map(filter => `
                                    <button class="px-4 py-2 text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition-colors">
                                        ${filter}
                                    </button>
                                `).join('')}
                            </div>
                        </div>
                        
                        <div class="overflow-x-auto">
                            <table class="w-full">
                                <thead class="bg-slate-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-700 uppercase">Date</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-700 uppercase">Shift</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-700 uppercase">Supervisor</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-700 uppercase">Operator</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-700 uppercase">Product</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-700 uppercase">Part</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-700 uppercase">Bin #</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-700 uppercase">Bin Wt (Kg)</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-700 uppercase">Avg Wt (Kg)</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-700 uppercase">Prod Wt (Kg)</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-700 uppercase">Quantity</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-700 uppercase">Heat No</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-slate-700 uppercase">Inspection</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200">
                                    ${sortedDates.length > 0 ? sortedDates.map(date => `
                                        <tr class="bg-slate-50">
                                            <td colspan="13" class="px-6 py-3">
                                                <div class="flex items-center gap-2">
                                                    <i data-lucide="calendar" class="text-slate-500 w-4 h-4"></i>
                                                    <span class="font-medium text-slate-900">
                                                        ${new Date(date).toLocaleDateString('en-US', { 
                                                            month: 'short', 
                                                            day: 'numeric', 
                                                            year: 'numeric' 
                                                        })}
                                                    </span>
                                                    <span class="text-sm text-slate-500 ml-2">
                                                        ${date === '2023-06-28' ? '(Today)' : '(Previous)'}
                                                    </span>
                                                </div>
                                            </td>
                                        </tr>
                                        ${groupedRecords[date].map(record => `
                                            <tr class="hover:bg-slate-50 transition-colors">
                                                <td class="px-6 py-4 text-slate-500 text-sm">
                                                    ${new Date(record.date).toLocaleDateString('en-US', { weekday: 'short' })}
                                                </td>
                                                <td class="px-6 py-4">
                                                    <span class="inline-flex items-center justify-center w-8 h-8 rounded-full text-sm font-medium 
                                                           ${record.shift === 'Day' ? 'bg-blue-100 text-blue-800' : 
                                                             'bg-violet-100 text-violet-800'}">
                                                        ${record.shift}
                                                    </span>
                                                </td>
                                                <td class="px-6 py-4 font-medium text-slate-900">${record.supervisor}</td>
                                                <td class="px-6 py-4 text-slate-700">${record.operator}</td>
                                                <td class="px-6 py-4 font-medium text-slate-900">${record.product}</td>
                                                <td class="px-6 py-4 text-slate-700">${record.part}</td>
                                                <td class="px-6 py-4 text-slate-700">${record.binNumber}</td>
                                                <td class="px-6 py-4 text-right font-medium text-slate-900">${record.binWeight.toFixed(1)}</td>
                                                <td class="px-6 py-4 text-right font-medium text-slate-900">${record.avgPartWeight.toFixed(3)}</td>
                                                <td class="px-6 py-4 text-right">
                                                    <div class="font-bold text-slate-900">${record.productionWeight.toFixed(1)}</div>
                                                </td>
                                                <td class="px-6 py-4 text-right">
                                                    <div class="font-bold text-slate-900">${record.productionQuantity.toLocaleString()}</div>
                                                </td>
                                                <td class="px-6 py-4 text-slate-700">${record.heatNo || '—'}</td>
                                                <td class="px-6 py-4">
                                                    <span class="inline-flex px-2 py-1 text-xs font-medium rounded-full
                                                           ${record.inspection === 'Passed' ? 'bg-emerald-100 text-emerald-800' : 
                                                             record.inspection === 'Rework' ? 'bg-amber-100 text-amber-800' : 
                                                             record.inspection === 'Rejected' ? 'bg-rose-100 text-rose-800' : 
                                                             'bg-slate-100 text-slate-800'}">
                                                        ${record.inspection || '—'}
                                                    </span>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    `).join('') : `
                                        <tr>
                                            <td colspan="13" class="px-6 py-12 text-center">
                                                <div class="text-slate-500">
                                                    <i data-lucide="file-text" class="w-12 h-12 mx-auto mb-4 opacity-50"></i>
                                                    <p class="text-lg font-medium text-slate-900">No production records found</p>
                                                    <p class="text-slate-600 mt-1">Production updates will appear here</p>
                                                </div>
                                            </td>
                                        </tr>
                                    `}
                                </tbody>
                            </table>
                        </div>
                        
                        <div class="px-6 py-4 border-t border-slate-200">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-6">
                                    <div>
                                        <div class="text-sm text-slate-600">Total Production</div>
                                        <div class="text-lg font-bold text-slate-900">
                                            ${appState.productionRecords.reduce((sum, r) => sum + r.productionWeight, 0).toFixed(1)} Kg
                                        </div>
                                    </div>
                                    <div>
                                        <div class="text-sm text-slate-600">Total Quantity</div>
                                        <div class="text-lg font-bold text-slate-900">
                                            ${appState.productionRecords.reduce((sum, r) => sum + r.productionQuantity, 0).toLocaleString()} parts
                                        </div>
                                    </div>
                                    <div>
                                        <div class="text-sm text-slate-600">Hourly Reports</div>
                                        <div class="text-lg font-bold text-slate-900">
                                            ${appState.hourlyReports.length}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderApp() {
            const root = document.getElementById('root');
            
            let pageContent = '';
            switch(appState.activePage) {
                case 'dashboard':
                    pageContent = renderDashboard();
                    break;
                case 'coil-stock':
                    pageContent = renderCoilStock();
                    break;
                case 'operations':
                    pageContent = renderOperations();
                    break;
                case 'update-production':
                    pageContent = renderUpdateProduction();
                    break;
                case 'completed':
                    pageContent = renderCompleted();
                    break;
                default:
                    pageContent = renderDashboard();
            }
            
            root.innerHTML = `
                ${renderSidebar()}
                <div class="ml-64">
                    ${renderHeader()}
                    <main class="min-h-[calc(100vh-80px)]">
                        ${pageContent}
                    </main>
                </div>
            `;
            
            // Re-initialize icons
            lucide.createIcons();
            
            // Load FontAwesome for dashboard icons
            if (!document.querySelector('link[href*="font-awesome"]')) {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = 'https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';
                document.head.appendChild(link);
            }
        }

        // Initialize the app
        renderApp();
    </script>
</body>
</html>
